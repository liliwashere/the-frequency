name: Publish Issue

on:
  schedule:
    - cron: '0 8 * * 2'    # Tuesday 08:00 UTC = 09:00 Lisbon (primary)
    - cron: '0 10 * * 2'   # Tuesday 10:00 UTC = 11:00 Lisbon (retry)
  workflow_dispatch:
    inputs:
      confirm_off_schedule:
        description: 'Sending on a non-Tuesday? Type "yes" to confirm.'
        required: false
        default: ''

permissions:
  contents: write   # allows pushing the updated archive back to main

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run publish pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_NAME: the-frequency
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPEN_TRACKER_URL: ${{ secrets.OPEN_TRACKER_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CONFIRM_OFF_SCHEDULE: ${{ github.event.inputs.confirm_off_schedule }}
          DRY_RUN: 'false'
        run: node publish.js

      - name: Commit updated archive and issue files
        run: |
          git config user.name "The Frequency Bot"
          git config user.email "newsletter@lilitarutyunyan.com"
          git add public/
          git diff --cached --quiet || git commit -m "chore: publish issue [skip ci]"
          git push
