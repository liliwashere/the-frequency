name: Publish Issue

on:
  schedule:
    # Three daily slots (UTC) → 09:00, 13:00, 19:00 Lisbon (WEST/UTC+1)
    # scheduler.js decides whether to actually publish based on schedule.json
    # weekly mode: only fires on the configured day at 09:00
    # campaign mode: fires all three slots within the burst window
    # once mode: fires only on the exact configured datetime
    - cron: '0 8 * * *'   # 09:00 Lisbon
    - cron: '0 12 * * *'  # 13:00 Lisbon
    - cron: '0 18 * * *'  # 19:00 Lisbon
  workflow_dispatch:   # allow manual trigger from GitHub UI

permissions:
  contents: write   # allows pushing the updated archive back to main

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run publish pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_NAME: the-frequency
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_FROM_ADDRESS: ${{ secrets.GMAIL_FROM_ADDRESS }}
          OPEN_TRACKER_URL: ${{ secrets.OPEN_TRACKER_URL }}
          DRY_RUN: 'false'
        run: node publish.js

      - name: Commit updated archive and issue files
        run: |
          git config user.name "The Frequency Bot"
          git config user.email "newsletter@lilitarutyunyan.com"
          git add public/
          git diff --cached --quiet || git commit -m "chore: publish issue [skip ci]"
          git push
