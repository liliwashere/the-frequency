name: Publish Issue

on:
  workflow_dispatch:   # triggered by Cloudflare Worker every Tuesday 08:00 UTC (+ 10:00 retry)

permissions:
  contents: write   # allows pushing the updated archive back to main

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run publish pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_NAME: the-frequency
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_FROM_ADDRESS: ${{ secrets.GMAIL_FROM_ADDRESS }}
          OPEN_TRACKER_URL: ${{ secrets.OPEN_TRACKER_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: 'false'
        run: node publish.js

      - name: Commit updated archive and issue files
        run: |
          git config user.name "The Frequency Bot"
          git config user.email "newsletter@lilitarutyunyan.com"
          git add public/
          git diff --cached --quiet || git commit -m "chore: publish issue [skip ci]"
          git push
