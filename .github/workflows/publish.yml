name: Publish Issue

on:
  # Minutes offset to :17 to avoid the top-of-hour queue congestion that
  # delays round-hour cron triggers by hours on GitHub Actions.
  schedule:
    - cron: '17 8 * * 2'    # Tuesday ~08:00 UTC = ~09:00 Lisbon (primary)
    - cron: '17 10 * * 2'   # Tuesday ~10:00 UTC = ~11:00 Lisbon (retry)
    - cron: '17 12 * * 2'   # Tuesday ~12:00 UTC = ~09:00 São Paulo (timezone catch-up)
  workflow_dispatch:         # manual override
    inputs:
      confirm_offday_send:
        description: 'Confirm sending on a non-Tuesday (intentional catch-up send — emails ALL subscribers immediately)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # allows pushing the updated archive back to main

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run publish pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_NAME: the-frequency
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPEN_TRACKER_URL: ${{ secrets.OPEN_TRACKER_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CONFIRM_OFFDAY_SEND: ${{ inputs.confirm_offday_send }}
          DRY_RUN: 'false'
          NO_PROXY: api.anthropic.com
        run: node publish.js

      - name: Commit updated archive and issue files
        run: |
          git config user.name "The Frequency Bot"
          git config user.email "newsletter@lilitarutyunyan.com"
          git add public/
          git diff --cached --quiet || git commit -m "chore: publish issue [skip ci]"
          git push
